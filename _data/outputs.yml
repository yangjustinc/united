# ---------------------------------------------------------------
# UNITED outputs
#
# Each output is one entry starting with "- type:".
# To add one: copy an entry, paste it, and change the details.
#
#   type:    a short label (Preprint, Paper, Video, Slides, Poster, Report)
#   title:   the full title, in quotes
#   where:   journal, server or event (optional)
#   when:    the date as you want it shown, e.g. "November 2026"
#   link:    the web address. Leave as "" if it isn't ready yet.
#            For a file stored in this repository, use a path like
#            "/assets/files/my-file.pdf".
#   status:  available    -> shown in the main list
#            coming-soon  -> shown under "Coming soon"
#
# Available items are shown in the order they appear here,
# so put the newest at the top.
# ---------------------------------------------------------------

- type: Video
  title: "Lunch and Learn: how routine data can be used to better understand the needs of people who use drugs and/or alcohol"
